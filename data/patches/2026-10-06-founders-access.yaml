summary: >-
  Founder's Access opened on October 6, 2026 at 11:00 AM PDT for Orange Mushroom
  and Zakum package holders. The level cap is 100. Players start on Maple
  Island and can travel to Victoria Island. First and second job advancements
  are open for Warrior, Magician, Bowman, and Thief. Includes the Kerning City
  Party Quest for level 21 and above, plus new Citizenship and Crafting systems.
