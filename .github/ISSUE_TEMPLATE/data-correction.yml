name: Data correction
description: A number or fact on the site is wrong.
title: "data: "
labels: [data]
body:
  - type: input
    id: page
    attributes:
      label: Which page or entry?
      placeholder: https://classicmaple.wiki/monsters/...
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: What the site says
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: What it should say
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build you saw it in
      options:
        - Grand Launch (launch-2026-10-21)
        - Founder's Access (founders-2026-10-06)
        - Closed Online Test 2 (cot2)
        - Newer build, not listed
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Drag in a screenshot, or paste a link to official patch notes.
    validations:
      required: true
