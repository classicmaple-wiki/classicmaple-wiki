name: Patch note update
description: A new patch is out and the wiki needs to catch up.
title: "patch: "
labels: [patch]
body:
  - type: input
    id: link
    attributes:
      label: Link to the official notes
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Patch date
      placeholder: "2026-10-21"
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What changed, in your own words
      description: One change per line. Please do not paste the official notes in full.
    validations:
      required: true
